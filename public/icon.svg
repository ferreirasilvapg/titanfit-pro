<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e31" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4" />

  <!-- Stylized Hexagon Shield -->
  <path d="M256 70 L400 150 L400 330 L256 425 L112 330 L112 150 Z" 
        fill="#111827" 
        stroke="url(#primaryGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Dynamic Dumbbell & Lightning Bolt -->
  <!-- Barbell Bar -->
  <rect x="160" y="244" width="192" height="24" rx="12" fill="#e2e8f0" />
  
  <!-- Outer Plates Left -->
  <rect x="140" y="196" width="22" height="120" rx="8" fill="url(#primaryGrad)" />
  <rect x="166" y="216" width="14" height="80" rx="6" fill="#94a3b8" />
  
  <!-- Outer Plates Right -->
  <rect x="350" y="196" width="22" height="120" rx="8" fill="url(#primaryGrad)" />
  <rect x="332" y="216" width="14" height="80" rx="6" fill="#94a3b8" />

  <!-- Glowing Lightning / Flame Pulse Center -->
  <path d="M266 160 L220 252 L260 252 L244 340 L300 240 L260 240 Z" 
        fill="#10b981" 
        stroke="#ffffff" 
        stroke-width="4"
        stroke-linejoin="round" />

  <!-- Titan text or pulse dot -->
  <circle cx="256" cy="380" r="8" fill="#06b6d4" />
</svg>
